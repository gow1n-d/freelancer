name: service_booking
description: A subscription-based mobile platform connecting freelancers with customers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.7.0
  firebase_storage: ^11.5.0

  # Payment
  razorpay_flutter: ^1.3.5

  # State Management
  provider: ^6.1.0

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  intl: ^0.18.1

  # Utilities
  uuid: ^4.2.1
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets can be added here later
  # assets:
  #   - assets/images/
  #   - assets/icons/
